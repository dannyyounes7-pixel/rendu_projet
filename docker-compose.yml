services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-transactions}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-transactions}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-transactions-local-secret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-transactions}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-transactions-local-secret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local "$$S3_ENDPOINT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/transactions
    restart: "no"

volumes:
  minio_data:
  postgres_data:
